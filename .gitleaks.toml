[extend]
useDefault = true

[allowlist]
description = "Narrowly scoped exceptions for documented harmless development and test fixtures"
stopwords = [
    "insecure-dev-secret-key-replace-in-production-min-32-chars",
    "a-very-secure-random-production-key-min-32-chars-long",
    "harmless-mock-credential-fixture-for-scanner-verification",
]
paths = [
    '''^services/api/tests/unit/test_config\.py$''',
]
