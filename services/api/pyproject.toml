[project]
name = "healthyindia-api"
version = "0.1.0"
description = "FastAPI backend service for healthyIndia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit security
]
ignore = [
    "S104", # possible binding to all interfaces (safe in container/dev settings)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # allow assert and test passwords in tests
"app/core/config.py" = ["S105"] # allow setting field name SECRET_KEY
"app/api/*" = ["B008"] # allow FastAPI Depends in route signatures

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
