name: healthyIndia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Lint, Test & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install system dependencies (Tesseract)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies with lockfile
        run: uv sync --frozen

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run linter and security analysis
        run: uv run ruff check .

      - name: Run test suite (unit, integration, security)
        run: uv run python -m pytest -v

  frontend-checks:
    name: Frontend Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies with lockfile
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict check
        run: pnpm run type-check

      - name: Run unit tests
        run: pnpm run test

      - name: Verify production build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
